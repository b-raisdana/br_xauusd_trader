ci:
  autofix_commits: true
repos:
- repo: local
  hooks:
  - id: ruff
    name: ruff-check
    entry: python -m ruff check --fix
    language: system
    types:
    - python
    exclude: ^(legacy_reference|archive_not_used_trash)/
  - id: ruff-format
    name: ruff-format
    entry: python -m ruff format
    language: system
    types:
    - python
    exclude: ^(legacy_reference|archive_not_used_trash)/
  - id: pytest-fast
    name: pytest
    entry: python -m pytest
    language: system
    pass_filenames: false
  - id: incremental-ratchet
    name: incremental ratchet
    language: system
    entry: python -m br_pre_commit.src.ratchet
    pass_filenames: false
    files: ^src/.*\.py$
