ci:
  autofix_commits: true
  autoupdate_schedule: monthly
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v5.0.0
  hooks:
  - id: trailing-whitespace
    exclude: ^archive_not_used_trash/
    stages:
    - pre-commit
  - id: end-of-file-fixer
    exclude: ^archive_not_used_trash/
    stages:
    - pre-commit
  - id: check-yaml
    exclude: ^archive_not_used_trash/
    stages:
    - pre-commit
  - id: check-toml
    exclude: ^archive_not_used_trash/
    stages:
    - pre-commit
  - id: check-added-large-files
    exclude: ^archive_not_used_trash/|\.drawio\.svg$
    args:
    - --maxkb=1024
    stages:
    - pre-commit
  - id: check-merge-conflict
    exclude: ^archive_not_used_trash/
    stages:
    - pre-commit
  - id: check-case-conflict
    exclude: ^archive_not_used_trash/
    stages:
    - pre-commit
  - id: debug-statements
    exclude: ^archive_not_used_trash/
    stages:
    - pre-commit
  - id: mixed-line-ending
    exclude: ^archive_not_used_trash/
    args:
    - --fix=lf
    stages:
    - pre-commit
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.16.2
  hooks:
  - id: ruff
    exclude: ^archive_not_used_trash/
    args:
    - --fix
    stages:
    - pre-commit
  - id: ruff-format
    exclude: ^archive_not_used_trash/
    stages:
    - pre-commit
- repo: local
  hooks:
  - id: pytest-fast
    exclude: ^archive_not_used_trash/
    name: pytest unit gate
    language: system
    entry: python -m pytest -q -m unit
    pass_filenames: false
    files: ^(src/.*\.py|tests/.*\.py|pyproject\.toml)$
    stages:
    - pre-commit
  - id: pytest-integration-collect
    exclude: ^archive_not_used_trash/
    name: pytest integration collection check
    language: system
    entry: python -m pytest --collect-only -m integration tests/integration
    pass_filenames: false
    files: ^tests/integration/.*\.py$
    stages:
    - pre-commit
  - id: integration-tests
    exclude: ^archive_not_used_trash/
    name: run modified integration tests
    language: system
    entry: python -m pytest -q -m integration
    pass_filenames: true
    files: ^tests/integration/.*\.py$
    stages:
    - pre-commit
  - id: sync-skill-files
    exclude: ^archive_not_used_trash/
    name: sync mirrored skill files
    language: system
    entry: python -m br_pre_commit.src.sync_skills
    pass_filenames: false
    files: ^\.[^/]+/(skills/[^/]+/SKILL\.md|git-commit/SKILL\.md)$
    stages:
    - pre-commit
  - id: incremental-ratchet
    exclude: ^archive_not_used_trash/
    name: incremental ratchet (mypy/ruff/xenon/loc - blocks regressions only, see
      README)
    language: system
    entry: python -m br_pre_commit.src.ratchet
    pass_filenames: false
    files: ^src/.*\.py$
    stages:
    - pre-commit
  - id: check-pandera-decorator
    exclude: ^archive_not_used_trash/
    name: check pandera_validate decorator
    language: system
    entry: python -m br_pre_commit.src.check_pandera_decorator
    pass_filenames: true
    files: ^src/.*\.py$
    stages:
    - pre-commit
  - id: no-commit-to-trunk
    exclude: ^archive_not_used_trash/
    name: block direct commits to protected branches
    language: system
    entry: python -m br_pre_commit.src.check_no_commit_to_trunk
    pass_filenames: false
    always_run: true
    stages:
    - pre-commit
  - id: no-object-annotations
    exclude: ^archive_not_used_trash/
    name: block object type annotations
    language: system
    entry: python -m br_pre_commit.src.check_no_object_annotations
    pass_filenames: true
