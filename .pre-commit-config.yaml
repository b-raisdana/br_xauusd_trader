ci:
  autofix_commits: true

repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff-check
        entry: python -m ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff-format
        entry: python -m ruff format
        language: system
        types: [python]
      - id: pytest-fast
        name: pytest
        entry: python -m pytest
        language: system
        pass_filenames: false
