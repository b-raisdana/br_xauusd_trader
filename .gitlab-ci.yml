# Offline acceptance gate. Runs the same commands as local development via
# scripts/dev.py so a green pipeline and a green local run mean the same thing.
#
# Native MT5 compile/tester evidence requires a Windows runner with MetaEditor
# and a terminal; it is never produced by this file. A green pipeline is
# offline regression evidence only, never native parity.

stages:
  - verify

default:
  image: python:3.12-slim
  interruptible: true

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # Correctness gates must keep development validation. Setting
  # DLF_ENVIRONMENT=production turns OFF Config.check_assertions, which would
  # silently weaken every assertion in the suite.
  DLF_ENVIRONMENT: "development"
  GIT_DEPTH: "20"

.python:
  before_script:
    - python -m pip install --upgrade pip
    # Core + dev profiles. MetaTrader5 carries a sys_platform marker and is
    # never installed on a Linux runner.
    - python -m pip install -e ".[dev]"

lint:
  stage: verify
  extends: .python
  script:
    - python scripts/dev.py inspect
    - python scripts/dev.py lint
    - python scripts/dev.py docs

tests:unit:
  stage: verify
  extends: .python
  script:
    - python scripts/dev.py test --tier unit --parallel auto

tests:integration:
  stage: verify
  extends: .python
  script:
    - python scripts/dev.py test --tier integration
    - python scripts/dev.py test --tier parity

package:
  stage: verify
  extends: .python
  script:
    - python scripts/dev.py build --smoke
  artifacts:
    when: always
    paths:
      - dist/
    expire_in: 1 week