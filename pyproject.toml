[project]
name = "xauusd-mvp"
version = "2.0.0"
description = "XAUUSD trading system MVP: strategy engine + cTrader Open API client"
requires-python = ">=3.12"
dependencies = [
    "br-logging-and-profiling>=0.5.2",
    "pandas==3.0.5",
    "numpy>=1.26.4,<2.2",
    "scipy==1.17.1",
    "pydantic==2.13.4",
    "pydantic-settings~=2.15.0",
    "pyarrow==25.0.1",
    "typer==0.27.1",
    "duckdb",
    "optree>=0.14.0",
    "deepdiff==9.1.0",
    "python-dotenv~=1.2.3",
    "pandera==0.32.1",
    "requests",
    "ctrader-open-api",
    "twisted",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=4.0",
    "ruff",
    "mypy",
    "pytest>=8.0",
    "pytest-asyncio",
    "pandas_ta",   
    "numba",       
]

[project.scripts]
ctrader-cli = "presentation.ctrader.ctrader_cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xauusd", "src/infrastructure", "src/helper", "src/presentation", "src/domain", "src/application", "src/config"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["unit: fast isolated unit tests"]
addopts = "-q -n auto"

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = ["legacy_reference", "archive_not_used_trash"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.12"
exclude = "^(legacy_reference|archive_not_used_trash)/"
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "ctrader_open_api.*",
    "google.protobuf.*",
    "google.protobuf.descriptor",
    "MetaTrader5",
    "requests.*",
    "twisted.*",
    "twisted.internet.*",
]
ignore_missing_imports = true

