[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
exclude = ["legacy_reference"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.mypy]
python_version = "3.11"
exclude = "^legacy_reference/"
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
