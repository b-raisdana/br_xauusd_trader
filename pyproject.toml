[project]
name = "xauusd-mvp"
version = "2.0.0"
description = "XAUUSD trading system MVP: strategy engine + cTrader Open API client"
requires-python = ">=3.12"
dependencies = [
    "br-logging-and-profiling>=0.5.2",
    "pandas==3.0.5",
    "numpy>=1.26.4,<2.2",
    "scipy==1.17.1",
    "pydantic==2.13.4",
    "pydantic-settings~=2.15.0",
    "pyarrow==25.0.1",
    "typer==0.27.1",
    "duckdb",
    "optree>=0.14.0",
    "deepdiff==9.1.0",
    "python-dotenv~=1.2.3",
    "pandera==0.32.1",
    "requests",
    "ctrader-open-api",
    "twisted",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest>=8.0",
    "pytest-asyncio",
]

[project.scripts]
ctrader-cli = "presentation.ctrader_cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xauusd", "src/infrastructure", "src/helper", "src/presentation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
exclude = ["legacy_reference"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.mypy]
python_version = "3.12"
exclude = "^legacy_reference/"
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "ctrader_open_api.*",
    "google.protobuf.*",
    "google.protobuf.descriptor",
    "MetaTrader5",
    "requests.*",
    "twisted.*",
    "twisted.internet.*",
]
ignore_missing_imports = true
